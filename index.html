<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barómetro ASG Latam — Hub de Inteligencia Bursátil & Riesgo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-8 bg-emerald-500 rounded-full"></div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Barómetro <span class="text-emerald-400">ASG Latam</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('rv')" id="btn-rv" class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white shadow-lg">Renta Variable (Acciones)</button>
                <button onclick="switchTab('rf')" id="btn-rf" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Renta Fija (Bonos ASG)</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Buscador y Filtro por País/Mercado -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Buscar por Ticker, Empresa o Emisor..." class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5 w-full sm:w-80 focus:outline-none focus:border-emerald-500">
            <select id="marketFilter" onchange="filterData()" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2.5">
                <option value="ALL">Todos los Mercados (Latam & Caribe)</option>
                <option value="BYMA">BYMA (Argentina)</option>
                <option value="B3">B3 (Brasil)</option>
                <option value="Santiago">Bolsa de Santiago (Chile)</option>
                <option value="bvc">bvc (Colombia)</option>
                <option value="BMV">BMV (México)</option>
                <option value="BVL">BVL (Perú)</option>
                <option value="JSE">JSE (Jamaica)</option>
            </select>
        </div>

        <!-- Vista Renta Variable -->
        <div id="tab-rv" class="block">
            <div class="overflow-x-auto bg-slate-950 border border-slate-800 rounded-xl shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800/80 text-xs text-slate-400 uppercase">
                        <tr>
                            <th class="p-4">Mercado</th>
                            <th class="p-4">Ticker / Empresa</th>
                            <th class="p-4">Sector</th>
                            <th class="p-4 text-center">Índice Local</th>
                            <th class="p-4 text-center">S&P Yearbook</th>
                            <th class="p-4 text-center">Categoría S&P</th>
                            <th class="p-4 text-center">Reporte ASG</th>
                        </tr>
                    </thead>
                    <tbody id="rv-table-body" class="divide-y divide-slate-800 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Vista Renta Fija -->
        <div id="tab-rf" class="hidden">
            <div class="overflow-x-auto bg-slate-950 border border-slate-800 rounded-xl shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800/80 text-xs text-slate-400 uppercase">
                        <tr>
                            <th class="p-4">Mercado</th>
                            <th class="p-4">Emisor / Bono</th>
                            <th class="p-4">Tipo</th>
                            <th class="p-4 text-center">Estado Riesgo</th>
                            <th class="p-4">Alerta / Indicador</th>
                            <th class="p-4">KPI Sostenibilidad</th>
                        </tr>
                    </thead>
                    <tbody id="rf-table-body" class="divide-y divide-slate-800 text-sm">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // ENLACES GOOGLE SHEETS (CSV PUBLICADO)
        const URL_CSV_RENTA_VARIABLE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRniAeWLI97k7vcn5TzlBg0n89Ird3Rb-619RqXvHTEJ-aIniWGzsCIKrYWt0fX_Q/pub?gid=373182793&single=true&output=csv";
        const URL_CSV_RENTA_FIJA = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRniAeWLI97k7vcn5TzlBg0n89Ird3Rb-619RqXvHTEJ-aIniWGzsCIKrYWt0fX_Q/pub?gid=2120126879&single=true&output=csv";

        // Base de Datos Demo completa para los 7 países
        const demoRV = [
            ["BYMA", "YPFD", "YPF S.A.", "Energía", "Sí", "Sí", "Industry Mover", "https://www.ypf.com/sustentabilidad"],
            ["BYMA", "GGAL", "Grupo Financiero Galicia", "Financiero", "Sí", "No", "N/A", "https://www.galicia.ar/sustentabilidad"],
            ["B3", "B3SA3", "B3 S.A. - Brasil", "Financiero", "Sí", "Sí", "Top 5%", "https://ri.b3.com.br/sostenibilidad"],
            ["B3", "ITUB4", "Itaú Unibanco", "Financiero", "Sí", "Sí", "Top 10%", "https://www.itau.com.br/sustentabilidade"],
            ["B3", "SUZB3", "Suzano S.A.", "Materiales", "Sí", "Sí", "Top 5%", "https://www.suzano.com.br/sustentabilidade"],
            ["Santiago", "CMPC", "Empresas CMPC", "Materiales", "Sí", "Sí", "Top 1%", "https://www.cmpc.com/sostenibilidad"],
            ["Santiago", "BSANTANDER", "Banco Santander Chile", "Financiero", "Sí", "Sí", "Top 10%", "https://www.santander.cl/sostenibilidad"],
            ["bvc", "BCOLOMBIA", "Bancolombia", "Financiero", "Sí", "Sí", "Top 1%", "https://www.bancolombia.com/sostenibilidad"],
            ["bvc", "ISA", "Interconexión Eléctrica ISA", "Servicios Públicos", "Sí", "Sí", "Top 5%", "https://www.isa.co/sostenibilidad"],
            ["BMV", "GFNORTE", "Grupo Financiero Banorte", "Financiero", "Sí", "Sí", "Top 5%", "https://investors.banorte.com/sostenibilidad"],
            ["BMV", "CEMEX", "Cemex", "Materiales", "Sí", "Sí", "Top 10%", "https://www.cemex.com/sostenibilidad"],
            ["BVL", "BAP", "Credicorp / BCP", "Financiero", "Sí", "Sí", "Member", "https://www.credicorp.com/sostenibilidad"],
            ["BVL", "CPACASC1", "Cementos Pacasmayo", "Materiales", "Sí", "Sí", "Industry Mover", "https://www.cementospacasmayo.com.pe"],
            ["JSE", "NCBFG", "NCB Financial Group", "Financiero", "Sí", "No", "N/A", "https://www.myncb.com/sustainability"]
        ];

        const demoRF = [
            ["BYMA", "Plaza Logística", "BPO2O", "Verde", "🟢 Normal", "AA+(arg)", "Cumplimiento normal de repagos", "Emisión neta neutral en parques"],
            ["B3", "Suzano S.A.", "US86964W", "SLB", "🟢 Normal", "BBB-", "Monitoreo regular de metas", "Reducción intensidad agua industrial 15%"],
            ["B3", "Light S.A.", "US532241", "Verde", "🔴 Alerta Default", "D", "En proceso de Recuperación Judicial", "Pérdidas no técnicas y proyectos eficiencia"],
            ["Santiago", "Codelco", "US219876", "Sostenible", "🟡 Observación", "BBB+", "Ajuste en proyectos hídricos", "Reducción 60% uso agua fresca 2030"],
            ["Santiago", "VTR Finance", "US918321", "SLB", "🔴 Alerta Default", "CC", "Riesgo reestructuración / periodo gracia", "Fibra óptica rural y eficiencia energética"],
            ["bvc", "Bancolombia", "US05968L", "Sostenible", "🟢 Normal", "BB+", "Emisión sostenible destacada", "Proyectos de energía solar y vivienda social"],
            ["bvc", "Ecopetrol", "US279158", "Sostenible", "🟡 Observación", "BB+", "Seguimiento descarbonización", "Reducción emisiones Alcance 1 y 2 al 25%"],
            ["BMV", "Cemex", "US151290", "SLB", "🟢 Normal", "BBB-", "Meta CO2 cumplida por tonelada", "Cemento bajo carbono Vertua"],
            ["BMV", "TV Azteca", "US88034P", "Sostenible", "🔴 Alerta Default", "D", "Conflicto legal / Incumplimiento de cupones", "Inclusión digital comunidades alejadas"],
            ["BVL", "COFIDE", "US197022", "Sostenible", "🟢 Normal", "BBB-", "Fondo desarrollo operando normal", "Financiamiento pymes lideradas por mujeres"],
            ["JSE", "TransJam Infra", "JM000100", "Verde", "🟢 Normal", "A+(jm)", "Pagos peaje verde regulares", "Reforestación y alumbrado solar en autopistas"]
        ];

        let datosRV = [];
        let datosRF = [];

        function switchTab(tab) {
            document.getElementById('tab-rv').classList.toggle('hidden', tab !== 'rv');
            document.getElementById('tab-rf').classList.toggle('hidden', tab !== 'rf');
            
            document.getElementById('btn-rv').className = tab === 'rv' 
                ? 'px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white shadow-lg' 
                : 'px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
            
            document.getElementById('btn-rf').className = tab === 'rf' 
                ? 'px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white shadow-lg' 
                : 'px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
        }

        function cargarDatos() {
            if (URL_CSV_RENTA_VARIABLE && URL_CSV_RENTA_VARIABLE.length > 10) {
                Papa.parse(URL_CSV_RENTA_VARIABLE, {
                    download: true,
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        datosRV = procesarFilasRV(results.data);
                        renderizarTablaRV(datosRV);
                    },
                    error: function() { usarFallbackRV(); }
                });
            } else {
                usarFallbackRV();
            }

            if (URL_CSV_RENTA_FIJA && URL_CSV_RENTA_FIJA.length > 10) {
                Papa.parse(URL_CSV_RENTA_FIJA, {
                    download: true,
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        datosRF = procesarFilasRF(results.data);
                        renderizarTablaRF(datosRF);
                    },
                    error: function() { usarFallbackRF(); }
                });
            } else {
                usarFallbackRF();
            }
        }

        function usarFallbackRV() {
            datosRV = demoRV.map(row => ({
                mercado: row[0], ticker: row[1], empresa: row[2], sector: row[3],
                indiceLocal: row[4], spYearbook: row[5], categoriaSP: row[6], reporte: row[7]
            }));
            renderizarTablaRV(datosRV);
        }

        function usarFallbackRF() {
            datosRF = demoRF.map(row => ({
                mercado: row[0], emisor: row[1], bono: row[2], tipo: row[3],
                estado: row[4], rating: row[5], alerta: row[6], kpi: row[7]
            }));
            renderizarTablaRF(datosRF);
        }

        function procesarFilasRV(rows) {
            const list = [];
            const mercadosValidos = ['BYMA', 'B3', 'Santiago', 'bvc', 'BMV', 'BVL', 'JSE'];
            rows.forEach(r => {
                if (!r || r.length < 3) return;
                const m = (r[0] || '').trim();
                if (mercadosValidos.includes(m)) {
                    list.push({
                        mercado: m, ticker: r[1] || '', empresa: r[2] || '', sector: r[3] || '',
                        indiceLocal: r[4] || '', spYearbook: r[5] || '', categoriaSP: r[6] || '', reporte: r[7] || ''
                    });
                }
            });
            return list.length > 0 ? list : demoRV.map(row => ({
                mercado: row[0], ticker: row[1], empresa: row[2], sector: row[3],
                indiceLocal: row[4], spYearbook: row[5], categoriaSP: row[6], reporte: row[7]
            }));
        }

        function procesarFilasRF(rows) {
            const list = [];
            const mercadosValidos = ['BYMA', 'B3', 'Santiago', 'bvc', 'BMV', 'BVL', 'JSE'];
            rows.forEach(r => {
                if (!r || r.length < 3) return;
                const m = (r[0] || '').trim();
                if (mercadosValidos.includes(m)) {
                    list.push({
                        mercado: m, emisor: r[1] || '', bono: r[2] || '', tipo: r[3] || '',
                        estado: r[4] || '', rating: r[5] || '', alerta: r[6] || '', kpi: r[7] || ''
                    });
                }
            });
            return list.length > 0 ? list : demoRF.map(row => ({
                mercado: row[0], emisor: row[1], bono: row[2], tipo: row[3],
                estado: row[4], rating: row[5], alerta: row[6], kpi: row[7]
            }));
        }

        function renderizarTablaRV(data) {
            const tbody = document.getElementById('rv-table-body');
            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                const isSP = item.spYearbook === 'Sí';
                const spBadge = isSP 
                    ? '<span class="px-2.5 py-1 text-xs border rounded-full font-medium bg-emerald-900/50 text-emerald-400 border-emerald-800">Sí</span>'
                    : '<span class="px-2.5 py-1 text-xs border rounded-full font-medium bg-slate-800 text-slate-400 border-slate-700">No</span>';

                tr.innerHTML = `
                    <td class="p-4"><span class="px-2 py-1 bg-slate-800 rounded-md text-xs font-medium">${item.mercado}</span></td>
                    <td class="p-4"><div class="font-bold text-white">${item.ticker}</div><div class="text-xs text-slate-400">${item.empresa}</div></td>
                    <td class="p-4 text-slate-300">${item.sector}</td>
                    <td class="p-4 text-center">${item.indiceLocal === 'Sí' ? '<span class="text-emerald-400 font-bold">✓</span>' : '-'}</td>
                    <td class="p-4 text-center">${spBadge}</td>
                    <td class="p-4 text-center text-slate-300 text-xs">${item.categoriaSP}</td>
                    <td class="p-4 text-center">${item.reporte ? `<a href="${item.reporte}" target="_blank" class="text-emerald-400 hover:underline text-xs">Ver Reporte ↗</a>` : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarTablaRF(data) {
            const tbody = document.getElementById('rf-table-body');
            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                
                let riesgoStyle = "bg-slate-800 text-slate-400 border-slate-700";
                if (item.estado.includes('Normal')) riesgoStyle = "bg-emerald-900/50 text-emerald-400 border-emerald-800";
                if (item.estado.includes('Observación')) riesgoStyle = "bg-yellow-900/50 text-yellow-400 border-yellow-800";
                if (item.estado.includes('Alerta')) riesgoStyle = "bg-red-900/50 text-red-400 border-red-800";

                tr.innerHTML = `
                    <td class="p-4"><span class="px-2 py-1 bg-slate-800 rounded-md text-xs font-medium">${item.mercado}</span></td>
                    <td class="p-4"><div class="font-bold text-white">${item.bono}</div><div class="text-xs text-slate-400">${item.emisor}</div></td>
                    <td class="p-4"><span class="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300">${item.tipo}</span></td>
                    <td class="p-4 text-center"><span class="px-2.5 py-1 text-xs border rounded-full font-medium ${riesgoStyle}">${item.estado}</span></td>
                    <td class="p-4 text-slate-300 text-xs">${item.alerta}</td>
                    <td class="p-4 text-slate-300 text-xs">${item.kpi}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const market = document.getElementById('marketFilter').value;

            const fRV = datosRV.filter(i => {
                const matchM = market === 'ALL' || i.mercado === market;
                const matchT = i.ticker.toLowerCase().includes(text) || i.empresa.toLowerCase().includes(text);
                return matchM && matchT;
            });
            renderizarTablaRV(fRV);

            const fRF = datosRF.filter(i => {
                const matchM = market === 'ALL' || i.mercado === market;
                const matchT = i.bono.toLowerCase().includes(text) || i.emisor.toLowerCase().includes(text);
                return matchM && matchT;
            });
            renderizarTablaRF(fRF);
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
